# Shadow
shadow = false;
no-dock-shadow = true;
no-dnd-shadow = true;
clear-shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.7;

# Opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 0.8;
inactive-opacity-override = true;
opacity-rule = ["90:class_g = 'Terminal'"];  # Adjust opacity for specific apps, e.g., terminal

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
};
