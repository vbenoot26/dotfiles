# Shadow
shadow = true;
no-dock-shadow = true;
no-dnd-shadow = true;
clear-shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.7;

# Opacity
inactive-opacity = 0.9;
active-opacity = 1.0;
frame-opacity = 0.8;
inactive-opacity-override = true;
opacity-rule = ["90:class_g = 'gnome-terminal'"];  # Adjust opacity for specific apps, e.g., terminal

# Fading
fading = true;
fade-delta = 12;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Window type settings
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.85; focus = true; };
};
